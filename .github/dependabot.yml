version: 2
updates:
  # Keep Go module dependencies up to date.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(go)"
    groups:
      go-deps:
        patterns:
          - "*"

  # Keep GitHub Actions pinned versions up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions:
        patterns:
          - "*"
